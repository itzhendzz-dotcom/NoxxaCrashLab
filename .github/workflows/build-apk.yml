name: Build Noxxa CrashLab V3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore Noxxa CrashLab V3 source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | tar -xz
          cp -a project/. .
          rm -rf project

      - name: Unit smoke test analyzer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/crashlab-test
          javac -d /tmp/crashlab-test app/src/main/java/com/noxxa/crashlab/CrashAnalyzer.java
          cat >/tmp/crashlab-test/Test.java <<'EOF'
          import com.noxxa.crashlab.CrashAnalyzer;
          public class Test {
            public static void main(String[] args) {
              String scudo = "ABI: 'arm64'\nsignal 6 (SIGABRT), code -1 (SI_QUEUE), fault addr --------\n#00 pc 000398e2 /apex/com.android.runtime/lib/bionic/libc.so (abort+137)\n#04 pc 0002f8a4 /apex/com.android.runtime/lib/bionic/libc.so (_ZN5scudo22reportHeaderCorruptionEPv+39)\n#06 pc 000306de /apex/com.android.runtime/lib/bionic/libc.so (scudo_free+21)";
              CrashAnalyzer.Result a = CrashAnalyzer.analyze(scudo);
              if (!"SCUDO_HEAP_CORRUPTION".equals(a.signature)) throw new RuntimeException("Scudo detection failed: " + a.signature);
              if (!a.topSuspect.startsWith("Not visible")) throw new RuntimeException("System-only Scudo stack should not blame libc: " + a.topSuspect);
              String segv = "signal 11 (SIGSEGV), code 1 (SEGV_MAPERR), fault addr 0xc\nbacktrace:\n#00 pc 00001000 /data/app/libBadMod.so (hook+12)\n#01 pc 00002000 /data/app/libGTASA.so (foo+3)";
              CrashAnalyzer.Result b = CrashAnalyzer.analyze(segv);
              if (!"libBadMod.so".equals(b.topSuspect)) throw new RuntimeException("Frame ranking failed: " + b.topSuspect);
              System.out.println("Analyzer smoke tests passed");
            }
          }
          EOF
          javac -cp /tmp/crashlab-test -d /tmp/crashlab-test /tmp/crashlab-test/Test.java
          java -cp /tmp/crashlab-test Test

      - name: Build V3 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify V3 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          shasum -a 256 "$APK"
          unzip -t "$APK" >/dev/null

      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxxaCrashLab-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
