name: Build APK - NoxxaCrashLab

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/NoxxaCrashLab/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/NoxxaCrashLab/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/NoxxaCrashLab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew (kalau ada)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Generate Gradle Wrapper (kalau belum ada)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxxaCrashLab-release
          path: android/NoxxaCrashLab/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK juga (opsional)
        uses: actions/upload-artifact@v4
        with:
          name: NoxxaCrashLab-debug
          path: android/NoxxaCrashLab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore