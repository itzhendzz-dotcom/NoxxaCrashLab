name: Build Noxxa CrashLab V5

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Restore Noxxa CrashLab V5 source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | tar -xz
          test -f app/src/main/java/com/noxxa/crashlab/CrashAnalyzer.java
          test -f app/src/main/java/com/noxxa/crashlab/ElfInspector.java
          test -f app/src/main/java/com/noxxa/crashlab/MainActivity.java
          grep -q "versionName '5.0.0'" app/build.gradle
          test -f app/src/main/java/com/noxxa/crashlab/UiCopy.java
          grep -q "showSettings" app/src/main/java/com/noxxa/crashlab/MainActivity.java
          grep -q "Bahasa Indonesia" app/src/main/java/com/noxxa/crashlab/MainActivity.java

      - name: Forensic engine smoke tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crashlab-test && mkdir -p /tmp/crashlab-test
          javac -d /tmp/crashlab-test             app/src/main/java/com/noxxa/crashlab/CrashAnalyzer.java             app/src/main/java/com/noxxa/crashlab/ElfInspector.java
          cat >/tmp/crashlab-test/Test.java <<'EOF'
          import com.noxxa.crashlab.CrashAnalyzer;
          import com.noxxa.crashlab.ElfInspector;
          import java.io.*;
          public class Test {
            public static void main(String[] args) throws Exception {
              String segv = "*** *** *** *** *** *** *** ***\nABI: 'arm64'\npid: 1, tid: 2, name: render >>> gta <<<\nsignal 11 (SIGSEGV), code 1 (SEGV_MAPERR), fault addr 0xc\nbacktrace:\n#00 pc 00001000 /data/app/libBadMod.so (hook_draw+12)\n#01 pc 00002000 /data/app/libGTASA.so (foo+3)";
              CrashAnalyzer.Result a = CrashAnalyzer.analyze(segv);
              if (!"SIGSEGV".equals(a.signature)) throw new RuntimeException("SIGSEGV classification failed");
              if (!"libBadMod.so".equals(a.topSuspect)) throw new RuntimeException("Frame ranking failed: " + a.topSuspect);
              if (a.typeConfidence < 90 || a.culpritConfidence < 60) throw new RuntimeException("Split confidence failed");

              String scudo = "ABI: 'arm64'\nsignal 6 (SIGABRT), code -1 (SI_QUEUE), fault addr --------\n#00 pc 000398e2 /apex/com.android.runtime/lib64/bionic/libc.so (abort+137)\n#04 pc 0002f8a4 /apex/com.android.runtime/lib64/bionic/libc.so (_ZN5scudo22reportHeaderCorruptionEPv+39)\n#06 pc 000306de /apex/com.android.runtime/lib64/bionic/libc.so (scudo_free+21)";
              CrashAnalyzer.Result b = CrashAnalyzer.analyze(scudo);
              if (!"SCUDO_HEAP_CORRUPTION".equals(b.signature)) throw new RuntimeException("Scudo detection failed");
              if (!b.topSuspect.startsWith("Not visible")) throw new RuntimeException("Scudo stack falsely blamed " + b.topSuspect);
              if (b.culpritConfidence > 48) throw new RuntimeException("Scudo culprit confidence too high");

              String mapped = "signal 11 (SIGSEGV), code 2 (SEGV_ACCERR), fault addr 0x70001010\n#00 pc 1000 /data/app/libMapped.so (patch+1)\n70000000-70010000 r-xp 00000000 103:12 123 /data/app/libMapped.so (BuildId: abcdef01)";
              CrashAnalyzer.Result c = CrashAnalyzer.analyze(mapped);
              if (!"libMapped.so".equals(c.faultMappedModule)) throw new RuntimeException("Fault-map resolution failed: " + c.faultMappedModule);
              if (!"abcdef01".equals(c.faultMappedBuildId)) throw new RuntimeException("Build ID map parse failed");

              String linker = "dlopen failed: library libJPatch.so not found: needed by libX.so";
              CrashAnalyzer.Result d = CrashAnalyzer.analyze(linker);
              if (!"DLOPEN_SYMBOL".equals(d.signature)) throw new RuntimeException("Linker classification failed");

              try (InputStream in = new FileInputStream("/bin/ls")) {
                ElfInspector.Result e = ElfInspector.inspect(in, "ls");
                if (e.buildId.isEmpty() || e.dynamicSymbolCount <= 0) throw new RuntimeException("ELF inspector smoke test failed");
              }

              CrashAnalyzer.CompareResult cmp = CrashAnalyzer.compare("loaded libGTASA.so", segv);
              if (cmp.regressionScore <= 0) throw new RuntimeException("Compare scoring failed");
              System.out.println("V5 forensic smoke tests passed");
            }
          }
          EOF
          javac -cp /tmp/crashlab-test -d /tmp/crashlab-test /tmp/crashlab-test/Test.java
          java -cp /tmp/crashlab-test Test

      - name: Build V5 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify V5 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='5.0.0'"

      - name: Upload V5 APK
        uses: actions/upload-artifact@v6
        with:
          name: NoxxaCrashLab-v5-motion-language-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
