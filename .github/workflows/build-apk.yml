name: Build Noxxa CrashLab V7

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Restore Noxxa CrashLab V7 source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | tar -xz
          cp -a project/. .
          rm -rf project
          test -f app/src/main/java/com/noxxa/crashlab/CrashAnalyzer.java
          test -f app/src/main/java/com/noxxa/crashlab/IssueFingerprint.java
          test -f app/src/main/java/com/noxxa/crashlab/IsolationPlanner.java
          test -f app/src/main/java/com/noxxa/crashlab/MainActivity.java
          test -f app/src/main/res/drawable/ic_splash_mark.xml
          test -f app/src/main/res/drawable/ic_launcher_foreground_v7.xml
          grep -q "versionName '7.0.0'" app/build.gradle
          grep -q "core-splashscreen:1.2.0" app/build.gradle
          grep -q "buildConfig true" app/build.gradle
          grep -q "WindowInsetsCompat.Type.statusBars()" app/src/main/java/com/noxxa/crashlab/MainActivity.java
          grep -q "Created by Noxxa Salvatore" app/src/main/java/com/noxxa/crashlab/MainActivity.java

      - name: V7 forensic engine smoke tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crashlab-test && mkdir -p /tmp/crashlab-test
          javac -d /tmp/crashlab-test app/src/main/java/com/noxxa/crashlab/CrashAnalyzer.java app/src/main/java/com/noxxa/crashlab/ElfInspector.java app/src/main/java/com/noxxa/crashlab/IssueFingerprint.java app/src/main/java/com/noxxa/crashlab/IsolationPlanner.java
          cat >/tmp/crashlab-test/Test.java <<'TESTEOF'
          import com.noxxa.crashlab.*;
          import java.io.*;
          import java.util.*;
          public class Test {
            public static void main(String[] args) throws Exception {
              String segvA = "*** *** *** ***\nABI: 'arm64'\nsignal 11 (SIGSEGV), code 1 (SEGV_MAPERR), fault addr 0xc\nbacktrace:\n#00 pc 00001000 /data/app/libBadMod.so (hook_draw+12)\n#01 pc 00002000 /data/app/libGTASA.so (foo+3)";
              String segvB = "*** *** *** ***\nABI: 'arm64'\nsignal 11 (SIGSEGV), code 1 (SEGV_MAPERR), fault addr 0x10\nbacktrace:\n#00 pc 00009000 /data/app/libBadMod.so (hook_draw+99)\n#01 pc 0000a000 /data/app/libGTASA.so (foo+42)";
              CrashAnalyzer.Result a = CrashAnalyzer.analyze(segvA);
              CrashAnalyzer.Result b = CrashAnalyzer.analyze(segvB);
              if (!"SIGSEGV".equals(a.signature)) throw new RuntimeException("SIGSEGV classification failed");
              if (!"libBadMod.so".equals(a.topSuspect)) throw new RuntimeException("Frame ranking failed: " + a.topSuspect);
              if (!IssueFingerprint.issueKey(a).equals(IssueFingerprint.issueKey(b))) throw new RuntimeException("Issue fingerprint unstable across addresses");
              String scudo = "ABI: 'arm64'\nsignal 6 (SIGABRT), code -1 (SI_QUEUE), fault addr --------\n#00 pc 000398e2 /apex/com.android.runtime/lib64/bionic/libc.so (abort+137)\n#04 pc 0002f8a4 /apex/com.android.runtime/lib64/bionic/libc.so (_ZN5scudo22reportHeaderCorruptionEPv+39)\n#06 pc 000306de /apex/com.android.runtime/lib64/bionic/libc.so (scudo_free+21)";
              CrashAnalyzer.Result c = CrashAnalyzer.analyze(scudo);
              if (!"SCUDO_HEAP_CORRUPTION".equals(c.signature)) throw new RuntimeException("Scudo detection failed");
              if (!c.topSuspect.startsWith("Not visible")) throw new RuntimeException("Scudo falsely blamed " + c.topSuspect);
              List<String> mods = IsolationPlanner.parseCandidates("A.so, B.so\nC.so; D.so");
              IsolationPlanner.Round round = IsolationPlanner.round(mods);
              if (round.enabled.size()!=2 || round.disabled.size()!=2) throw new RuntimeException("Isolation split failed");
              try (InputStream in = new FileInputStream("/bin/ls")) {
                ElfInspector.Result e = ElfInspector.inspect(in, "ls");
                if (e.buildId.isEmpty() || e.dynamicSymbolCount <= 0) throw new RuntimeException("ELF inspector failed");
              }
              System.out.println("V7 forensic engine smoke tests passed");
            }
          }
          TESTEOF
          javac -cp /tmp/crashlab-test -d /tmp/crashlab-test /tmp/crashlab-test/Test.java
          java -cp /tmp/crashlab-test Test

      - name: V7 shell and resource sanity checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SplashScreen.installSplashScreen(this)" app/src/main/java/com/noxxa/crashlab/MainActivity.java
          grep -q "BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE" app/src/main/java/com/noxxa/crashlab/MainActivity.java
          grep -q "ic_launcher_round" app/src/main/AndroidManifest.xml
          grep -q "monochrome" app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q "AppTheme.Starting" app/src/main/res/values/styles.xml
          grep -q "CREATED BY NOXXA SALVATORE" app/src/main/java/com/noxxa/crashlab/MainActivity.java

      - name: Build V7 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Verify V7 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='7.0.0'"

      - name: Upload V7 APK
        uses: actions/upload-artifact@v6
        with:
          name: NoxxaCrashLab-v7-immersive-incident-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
